<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:440px;height:280px;overflow:hidden}
body{background:linear-gradient(150deg,#0e2433 0%,#0c1a2c 50%,#091324 100%)}
.orb{position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#3f6fe0 0%,rgba(63,111,224,0.25) 60%,transparent 70%)}
.lotus{position:absolute;left:30px;top:70px;width:96px;height:96px;border-radius:24px;background:linear-gradient(145deg,#4dabf7,#1a5fc6);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(29,93,216,0.45)}
.svg{width:64px;height:64px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25))}
.name{position:absolute;left:158px;top:88px;font:800 34px system-ui;color:#ffffff;letter-spacing:0.5px}
.tag{position:absolute;left:158px;top:150px;font:500 16px system-ui;color:#a9c1de}
</style></head><body>
<div class="orb"></div>
<div class="lotus"><img class="svg" src="../../icons/phosphor/flower-lotus.svg"></div>
<div class="name">ZenBlock</div>
<div class="tag">Blocks ads &amp; trackers</div>
</body></html>
